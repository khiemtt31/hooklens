root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/hooklens ./cmd/hooklens"
entrypoint = "./tmp/hooklens"
include_ext = ["go"]
exclude_dir = ["tmp", "vendor", "bruno"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true
